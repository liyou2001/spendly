<!-- Sign-in email. The app signs in with the code, not a link. -->
<div style="font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #2b2420">
  <h2 style="font-weight: 500">Your Spendly sign-in code</h2>
  <p>Enter this code in the app to sign in:</p>
  <p style="font-size: 32px; letter-spacing: 0.2em; font-weight: 600">{{ .Token }}</p>
  <p style="color: #6b5f57">
    It expires in an hour and works once. If you didn't ask for it, you can ignore this email.
  </p>
</div>
